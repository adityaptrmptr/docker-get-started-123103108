
services:
  server:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      POSTGRES_DB: heroes
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db-password

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      POSTGRES_DB: heroes
    secrets:
      - db-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d heroes"]
      interval: 5s
      timeout: 5s
      retries: 10

secrets:
  db-password:
    file: ./db/password.txt

volumes:
  postgres-data:
